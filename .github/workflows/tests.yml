name: tests
on: [push, pull_request]
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python -m epidemic_rl run --country england --profile parallel-smoke --output validation/england
      - run: python -m epidemic_rl run --country belgium --profile smoke --output validation/belgium
      - run: python tests/verify_completed_protocol.py validation/england validation/belgium
